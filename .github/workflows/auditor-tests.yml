name: Matched-viewport accessibility comparison
on:
  push:
    branches: [codex/two-site-accessibility-benchmark]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned engines
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
          npx -y @accesslint/cli@0.13.0 --version
      - name: Compare engines on the same open page and viewport
        run: |
          cat > paired-probe.cjs <<'JS'
          const fs=require('fs'), cp=require('child_process'), {promisify}=require('util');
          const execFile=promisify(cp.execFile);
          const {chromium}=require('playwright');
          const tags=['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22a','wcag22aa'];
          (async()=>{
           fs.mkdirSync('paired-reports',{recursive:true});
           const chrome=cp.spawn(chromium.executablePath(),['--headless','--no-sandbox','--remote-debugging-port=9222','--user-data-dir=/tmp/paired-a11y-profile'],{stdio:'ignore'});
           let browser;
           try{
            for(let i=0;i<40;i++){try{const r=await fetch('http://127.0.0.1:9222/json/version');if(r.ok)break;}catch{}await new Promise(r=>setTimeout(r,250));}
            browser=await chromium.connectOverCDP('http://127.0.0.1:9222');
            for(const [name,url] of [['nextimpact','https://nextimpact.co.il'],['refeel','https://refeel.co.il']]){
             const page=await browser.contexts()[0].newPage();
             await page.setViewportSize({width:1280,height:800});
             await page.goto(url,{waitUntil:'load',timeout:60000});
             await page.waitForTimeout(1500);
             const signature=()=>page.evaluate(()=>({url:location.href,width:innerWidth,height:innerHeight,title:document.title,labels:[...document.querySelectorAll('a[aria-label]')].map(e=>[e.textContent.trim(),e.getAttribute('aria-label')]),elementCount:document.querySelectorAll('*').length}));
             const before=await signature();
             let result;
             try{result=await execFile('npx',['-y','@accesslint/cli@0.13.0','scan',url,'--attach','--format','json'],{timeout:120000,maxBuffer:10*1024*1024});}
             catch(e){if(e.stdout)result=e;else throw e;}
             const al=JSON.parse(result.stdout);
             await page.addScriptTag({path:require.resolve('axe-core/axe.min.js')});
             const tagged=await page.evaluate(tags=>axe.run(document,{runOnly:{type:'tag',values:tags}}),tags);
             const explicit=await page.evaluate(()=>axe.run(document,{runOnly:{type:'rule',values:['label-content-name-mismatch','skip-link','heading-order','landmark-one-main']}}));
             const after=await signature();
             const record={name,before,after,accesslint:al,axeTagged:tagged,axeSelected:explicit};
             fs.writeFileSync('paired-reports/'+name+'.json',JSON.stringify(record,null,2));
             const summary=r=>({violations:r.violations.map(v=>({id:v.id,n:v.nodes.length,examples:v.nodes.slice(0,2).map(n=>({html:n.html,target:n.target,explanation:n.failureSummary}))})),incomplete:r.incomplete.map(v=>({id:v.id,n:v.nodes.length}))});
             console.log('PAIRED_RESULT '+JSON.stringify({name,before,after,accesslint:{engine:al.testEngine,env:al.testEnvironment,violations:al.violations},axeTagged:summary(tagged),axeSelected:summary(explicit)}));
             await page.close();
            }
           }finally{if(browser)await browser.close();chrome.kill();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node paired-probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matched-viewport-comparison
          path: paired-reports/
          if-no-files-found: error
