<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Contact our local shop</title></head>
<body><main><h1>Contact us</h1><p>Send a question to our team.</p>
<form><label for="email">Your email</label><input id="email" type="email">
<label for="message">Your message</label><textarea id="message"></textarea>
<!-- Keep the provider-shaped iframe URL local; no external CAPTCHA requests. -->
<iframe src="/google.com/recaptcha/widget" title="Security verification"></iframe>
<button type="submit">Send message</button></form>
<a href="#privacy">Privacy information</a><p id="privacy">This local demonstration does not submit messages.</p>
</main></body></html>
